name: WPF App CI/CD Pipeline

on:
  push:
    branches:      
      - master
    tags:
      - 'v*'
  pull_request:
    branches:      
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- JOB 1: RUNS ON EVERY PUSH OR PULL REQUEST ---
  test-and-validate:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore

    - name: Build and Run MSTest Suites
      run: |
        msbuild /t:Restore,Build /p:Configuration=Release
        dotnet test --no-build --configuration Release
        
        # --- JOB 2: RUNS ONLY ON TAG PUSHES, AFTER TESTS PASS ---
  publish-and-release:
    runs-on: windows-latest
    needs: test-and-validate # Ensures tests must pass before this job starts
    if: startsWith(github.ref, 'refs/tags/v') # Blocks this job unless it's a version tag
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore

    - name: Build Application for Release
      run: msbuild /p:Configuration=Release /p:OutputPath=../publish_output

    - name: Zip the Application Binaries
      run: Compress-Archive -Path ./publish_output/* -DestinationPath ./ClearFolder_${{ github.ref_name }}.zip

    - name: Create GitHub Release and Upload Zip
      uses: softprops/action-gh-release@v2
      with:
        files: ./ClearFolder_${{ github.ref_name }}.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false