name: WPF App Auto-Publisher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # This sets up the full enterprise MSBuild engine needed for COM references
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore

    # Compiles using full MSBuild to handle COM references correctly
    - name: Compile and Publish WPF App
      run: msbuild /p:Configuration=Release /p:PublishDir=../publish_output /t:Publish

    - name: Zip the Application Binaries
      run: Compress-Archive -Path ./publish_output/* -DestinationPath ./WPF_Application_Release.zip

    - name: Create GitHub Release and Upload Zip
      uses: softprops/action-gh-release@v2
      with:
        files: ./WPF_Application_Release.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
