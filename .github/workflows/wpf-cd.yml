name: WPF App Auto-Publisher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # This sets up the full enterprise MSBuild engine needed for COM references
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore
      
      # --- AUTOMATED TESTING LAYER ---
    - name: Run MSTest Suites
      run: |
        msbuild /t:Restore,Build /p:Configuration=Release
        vstest.console.exe **\*Test*.dll /TestCaseFilter:"TestCategory!=Integration"

    # Compiles using full MSBuild to handle COM references correctly
    # Outputs clean binaries specifically into the publish folder
    - name: Build Application for Release
      run: msbuild /p:Configuration=Release /p:OutputPath=../publish_output

    - name: Zip the Application Binaries
      run: Compress-Archive -Path ./publish_output/* -DestinationPath ./ClearFolder_${{ github.ref_name }}.zip

    - name: Create GitHub Release and Upload Zip
      uses: softprops/action-gh-release@v2
      with:
        files: ./ClearFolder_${{ github.ref_name }}.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false