name: WPF App Auto-Publisher

on:
  push:
    tags:
      - 'v*' # Triggers the pipeline only when you push a version tag like v1.0.0
  workflow_dispatch: # Allows you to also trigger this manually from the GitHub webpage

permissions:
  contents: write

jobs:
  publish-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0' # Match your target WPF .NET version (e.g., 6.0, 8.0, 9.0)

    - name: Restore Dependencies
      run: dotnet restore

    - name: Compile and Publish WPF App
      run: dotnet publish --configuration Release -o ./publish_output

    - name: Zip the Application Binaries
      run: Compress-Archive -Path ./publish_output/* -DestinationPath ./WPF_Application_Release.zip

    - name: Create GitHub Release and Upload Zip
      uses: softprops/action-gh-release@v2
      with:
        files: ./WPF_Application_Release.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
